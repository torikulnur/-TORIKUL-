<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>T-Tech IPTV | Live Streaming Portal</title>
    <style>
      /* Ensure smooth rendering and scroll behaviors */
      html, body {
        background-color: #0b0f19;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
        font-family: 'Inter', sans-serif;
      }
      /* Loading screen placeholder fallback */
      #fallback-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        z-index: 9999;
        font-family: inherit;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      .cyber-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(6, 182, 212, 0.1);
        border-top: 3px solid #06b6d4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Persistent neon layout preloader -->
    <div id="fallback-loader">
      <div class="cyber-spinner"></div>
      <div style="margin-top: 1.5rem; font-weight: 600; letter-spacing: 0.1em; color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);">T-TECH IPTV CODEBASE</div>
      <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.5rem;">Launching High-Fidelity Cyber System...</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Remove loading indicator once bundle executes
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('fallback-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      });
    </script>
  </body>
</html>
